name: smartreserve
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  desktop_drop: ^0.7.1
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  supabase_flutter: ^2.10.3
  file_picker: ^12.0.0-beta.1
  file_saver: ^0.4.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  pdf: ^3.11.3
  printing: ^5.14.2
  crypto: ^3.0.6
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "assets/smart reserve logo.png"
  android: true
  ios: true
  windows:
    generate: true
  macos:
    generate: true
  web:
    generate: true
    image_path: "assets/smart reserve logo.png"
    background_color: "#F3EFF5"
    theme_color: "#800020"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/smart reserve logo.png
    - assets/smart reserve logo transpatent.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
